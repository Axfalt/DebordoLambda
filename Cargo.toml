[package]
name = "DebordoLambda"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/worker.rs"

[dependencies]
rand = "0.10.2"
rand_mt = "6.0.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

# AWS Lambda
lambda_runtime = "1.3"
aws_lambda_events = "1.2"
tokio = { version = "1", features = ["full"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ssm = "1"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

# HTTP client pour Discord webhooks
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Discord signature verification
ed25519-dalek = "3.0"
hex = "0.4"

# Tracing pour les logs Lambda
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

