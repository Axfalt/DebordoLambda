name: Deploy to AWS Lambda

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-lambda
        run: pip3 install cargo-lambda

      - name: Build Lambda
        run: cargo lambda build --release --arm64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-build-prod
          path: target/lambda/

  deploy:
    runs-on: ubuntu-latest
    needs: compile
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-build-prod
          path: target/lambda/

      - name: Install cargo-lambda
        run: pip3 install cargo-lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Deploy Receiver Lambda
        run: |
          cargo lambda deploy \
            --binary-name bootstrap \
            --role ${{ secrets.LAMBDA_ROLE_ARN }} \
            --region eu-west-3 \
            --env-var DISCORD_PUBLIC_KEY=${{ secrets.DISCORD_PUBLIC_KEY }} \
            --env-var SQS_QUEUE_URL=${{ secrets.SQS_QUEUE_URL }} \
            ${{ vars.LAMBDA_RECEIVER_FUNCTION_NAME || 'DebordoLambda' }}

      - name: Deploy Worker Lambda
        run: |
          cargo lambda deploy \
            --binary-name worker \
            --role ${{ secrets.LAMBDA_ROLE_ARN }} \
            --region eu-west-3 \
            --timeout 300 \
            ${{ vars.LAMBDA_WORKER_FUNCTION_NAME || 'DebordoLambdaWorker' }}

  register:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Register Discord commands (Prod)
        run: |
          pip3 install requests
          python register_command.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID || vars.DISCORD_APPLICATION_ID }}
